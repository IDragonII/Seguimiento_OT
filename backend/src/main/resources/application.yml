spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/ot
    username: ot_user
    password: ot_pass
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: update
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  liquibase:
    enabled: false

  flyway:
    enabled: false

server:
  port: 8080
  servlet:
    session:
      cookie:
        http-only: true
        secure: false
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  info:
    build: ${project.build}
    version: ${project.version}

jwt:
  header: Authorization
  prefix: Bearer
  secret: OT2026-Sistema-Ordenes-Trabajo-Clave-Secreta-MuySegura
  expiration: 86400000
  refresh-expiration: 2592000000