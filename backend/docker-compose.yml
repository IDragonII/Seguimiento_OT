services:
  backend:
    build: .
    container_name: ot-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/ot
      - SPRING_DATASOURCE_USERNAME=ot_user
      - SPRING_DATASOURCE_PASSWORD=ot_pass
      - JWT_SECRET=OT2026-Sistema-Ordenes-Trabajo-Clave-Secreta-MuySegura
      - SPRING_JPA_HIBERNATE_DDL-auto=update
      - SPRING_LOGGING_LEVEL=INFO
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:15-alpine
    container_name: ot-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=ot
      - POSTGRES_USER=ot_user
      - POSTGRES_PASSWORD=ot_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ot_user -d ot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: